name: Deploy to Firebase Hosting on PR
on:
  pull_request:
    paths:
      - "hosting/**"
      - "firebase.json"
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hosting/package-lock.json
      - run: npm ci
        working-directory: hosting
      # Builds the coming-soon page and the lazy-loaded /admin dashboard into
      # hosting/dist, which is what firebase.json serves. The Firebase web
      # config is public and lives in the source, so there is nothing to inject.
      - run: npm run build
        working-directory: hosting
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HORIZON_SIDEQUESTS }}
          projectId: horizon-sidequests
