<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCE4CE"/>
      <stop offset="0.34" stop-color="#FBEEE1"/>
      <stop offset="0.7" stop-color="#FBF6EF"/>
      <stop offset="1" stop-color="#FBF8F3"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="-0.04" r="0.62">
      <stop offset="0" stop-color="#FFD3B0" stop-opacity="0.95"/>
      <stop offset="0.34" stop-color="#FFBE9C" stop-opacity="0.5"/>
      <stop offset="0.78" stop-color="#FFB693" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rayFade" cx="0.5" cy="0.0" r="0.9">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.42" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="0.82" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="rmask"><rect width="1600" height="1000" fill="url(#rayFade)"/></mask>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDev="11"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>

  <g mask="url(#rmask)" filter="url(#soften)" fill="#FFB998">
    <polygon points="791.4,-90 808.6,-90 -620.7,1000 -1207.8,1000" opacity="0.05"/>
    <polygon points="788.1,-90 811.9,-90 -63.3,1000 -470.9,1000" opacity="0.07"/>
    <polygon points="792.1,-90 807.9,-90 207.3,1000 21.5,1000" opacity="0.06"/>
    <polygon points="788.9,-90 811.1,-90 476.8,1000 207.8,1000" opacity="0.09"/>
    <polygon points="788.4,-90 811.6,-90 604.4,1000 483.9,1000" opacity="0.07"/>
    <polygon points="789.8,-90 810.2,-90 815.3,1000 623.5,1000" opacity="0.11"/>
    <polygon points="789.2,-90 810.8,-90 991.6,1000 856.5,1000" opacity="0.08"/>
    <polygon points="789.7,-90 810.3,-90 1244.1,1000 995.5,1000" opacity="0.1"/>
    <polygon points="792.3,-90 807.7,-90 1435.9,1000 1268.5,1000" opacity="0.06"/>
    <polygon points="790.5,-90 809.5,-90 1764.1,1000 1467.7,1000" opacity="0.08"/>
    <polygon points="792.2,-90 807.8,-90 2170.4,1000 1834.4,1000" opacity="0.06"/>
    <polygon points="788.1,-90 811.9,-90 2917.3,1000 2234.0,1000" opacity="0.05"/>
  </g>

  <rect width="1600" height="1000" fill="url(#sun)"/>
  <rect width="1600" height="1000" filter="url(#grain)"/>
</svg>
