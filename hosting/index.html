<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Horizon</title>
    <meta name="description" content="Coming very soon." />
    <meta name="robots" content="noindex" />
    <style>
      /* The coming-soon page is inlined so `/` paints its final look on the
         first byte, before any JS parses. React renders the identical markup
         over it on mount, so there is no flash and no layout shift. */
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: #000;
      }
      .boot {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .boot h1 {
        margin: 0;
        font-weight: 500;
        letter-spacing: 0.02em;
        font-size: clamp(1.5rem, 6vw, 3rem);
        opacity: 0.92;
        animation: breathe 4s ease-in-out infinite;
      }
      @keyframes breathe {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot h1 {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot"><h1>coming very soon</h1></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
