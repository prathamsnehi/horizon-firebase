<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Horizon — one quest, today</title>
    <meta
      name="description"
      content="Horizon turns something you avoid into one small quest at a real place near you. iOS, free."
    />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&family=Archivo:wght@400;500;600;800&family=Barlow+Condensed:wght@400;500;600;700&family=Caveat:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Light pre-paint so the marketing site at `/` shows no flash before React
         mounts (Home.tsx then themes <body>). The admin route reverts to its dark
         dashboard theme on mount. React replaces #root's children, dropping .boot. */
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
      }
      .boot {
        min-height: 100vh;
        background: #fbf8f3;
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
