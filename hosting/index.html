<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Horizon — one quest, today</title>
    <meta
      name="description"
      content="Horizon turns something you avoid into one small quest at a real place near you. iOS, free."
    />
    <meta name="theme-color" content="#FBF8F3" />

    <!-- Favicon / app icons. favicon.svg (the sunrise mark) ships in /public. Drop a
         180² apple-touch-icon.png and a 1200×630 og.png (from the app icon) into
         hosting/public to complete the touch icon + social share image. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / Twitter — the link-share preview. Absolute URLs use the default
         Firebase Hosting domain; change them if you launch on a custom domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://horizon-sidequests.web.app/" />
    <meta property="og:title" content="Horizon — one quest, today" />
    <meta
      property="og:description"
      content="Tell Horizon what you avoid. It hands back one quest at a real place near you. iOS, free."
    />
    <meta property="og:image" content="https://horizon-sidequests.web.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Horizon — one quest, today" />
    <meta
      name="twitter:description"
      content="Tell Horizon what you avoid. It hands back one quest at a real place near you."
    />
    <meta name="twitter:image" content="https://horizon-sidequests.web.app/og.png" />

    <!-- Structured data for search/link previews. Deliberately no ratings/reviews
         (the app is pre-launch) — only facts. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Horizon",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "iOS",
        "description": "Horizon turns something you avoid into one small quest at a real place near you. One quest a day, no feed, no streaks.",
        "url": "https://horizon-sidequests.web.app/",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Caveat:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Light pre-paint so the marketing site at `/` shows no flash before React
         mounts (Home.tsx then themes <body>). The admin route reverts to its dark
         dashboard theme on mount. React replaces #root's children, dropping .boot. */
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
      }
      .boot {
        min-height: 100vh;
        background: #fbf8f3;
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
